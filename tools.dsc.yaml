$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

resources:
  - name: ensure-local-bin
    type: Microsoft.DSC/PowerShell
    properties:
      resources:
        - name: local-bin
          type: WinTools/LocalBinPath
          properties: {}
        - name: cargo-bin
          type: WinTools/LocalBinPath
          properties:
            Path: '%USERPROFILE%\.cargo\bin'

  - name: install-tools
    type: Microsoft.DSC/PowerShell
    dependsOn:
      - "[resourceId('Microsoft.DSC/PowerShell', 'ensure-local-bin')]"
    properties:
      resources:
        - name: ripgrep
          type: WinTools/DirectArchive
          properties:
            Name: ripgrep
            Url: https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-pc-windows-msvc.zip
            Binaries: [rg.exe]

        - name: fd
          type: WinTools/DirectArchive
          properties:
            Name: fd
            Url: https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-x86_64-pc-windows-msvc.zip
            Binaries: [fd.exe]

        - name: fzf
          type: WinTools/DirectArchive
          properties:
            Name: fzf
            Url: https://github.com/junegunn/fzf/releases/download/v0.72.0/fzf-0.72.0-windows_amd64.zip
            Binaries: [fzf.exe]

        - name: just
          type: WinTools/DirectArchive
          properties:
            Name: just
            Url: https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-x86_64-pc-windows-msvc.zip
            Binaries: [just.exe]

        - name: uv
          type: WinTools/DirectArchive
          properties:
            Name: uv
            Url: https://github.com/astral-sh/uv/releases/download/0.11.14/uv-x86_64-pc-windows-msvc.zip
            Binaries: [uv.exe, uvx.exe]

        - name: gh
          type: WinTools/DirectArchive
          properties:
            Name: gh
            Url: https://github.com/cli/cli/releases/download/v2.92.0/gh_2.92.0_windows_amd64.zip
            Binaries: [gh.exe]

        - name: rustup-init
          type: WinTools/DirectBinary
          properties:
            Name: rustup-init.exe
            Url: https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe

        - name: dprint
          type: WinTools/DirectArchive
          properties:
            Name: dprint
            Url: https://github.com/dprint/dprint/releases/download/0.54.0/dprint-x86_64-pc-windows-msvc.zip
            Binaries: [dprint.exe]

        - name: beads
          type: WinTools/DirectArchive
          properties:
            Name: beads
            Url: https://github.com/gastownhall/beads/releases/download/v1.0.4/beads_1.0.4_windows_amd64.zip
            Binaries: [bd.exe]

        - name: claude-code
          type: WinTools/ScriptInstaller
          properties:
            Name: claude-code
            ScriptUrl: https://claude.ai/install.ps1
            TestPath: '%USERPROFILE%\.local\bin\claude.exe'

  - name: install-dprint-plugins
    type: Microsoft.DSC/PowerShell
    dependsOn:
      - "[resourceId('Microsoft.DSC/PowerShell', 'install-tools')]"
    properties:
      resources:
        - name: dprint-markdown
          type: WinTools/DprintPlugin
          properties:
            Plugin: markdown

