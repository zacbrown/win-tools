$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

resources:
  - name: ensure-local-bin
    type: Microsoft.DSC/PowerShell
    properties:
      resources:
        - name: local-bin
          type: WinTools/LocalBinPath
          properties: {}
        - name: cargo-bin
          type: WinTools/LocalBinPath
          properties:
            Path: '%USERPROFILE%\.cargo\bin'

  - name: install-tools
    type: Microsoft.DSC/PowerShell
    dependsOn:
      - "[resourceId('Microsoft.DSC/PowerShell', 'ensure-local-bin')]"
    properties:
      resources:
        - name: ripgrep
          type: WinTools/DirectArchive
          properties:
            Name: ripgrep
            Url: https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-pc-windows-msvc.zip
            Version: 15.1.0
            Binaries: [rg.exe]

        - name: fd
          type: WinTools/DirectArchive
          properties:
            Name: fd
            Url: https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-x86_64-pc-windows-msvc.zip
            Version: 10.4.2
            Binaries: [fd.exe]

        - name: fzf
          type: WinTools/DirectArchive
          properties:
            Name: fzf
            Url: https://github.com/junegunn/fzf/releases/download/v0.72.0/fzf-0.72.0-windows_amd64.zip
            Version: 0.72.0
            Binaries: [fzf.exe]

        - name: just
          type: WinTools/DirectArchive
          properties:
            Name: just
            Url: https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-x86_64-pc-windows-msvc.zip
            Version: 1.51.0
            Binaries: [just.exe]

        - name: uv
          type: WinTools/DirectArchive
          properties:
            Name: uv
            Url: https://github.com/astral-sh/uv/releases/download/0.11.14/uv-x86_64-pc-windows-msvc.zip
            Version: 0.11.14
            Binaries: [uv.exe, uvx.exe]

        - name: gh
          type: WinTools/DirectArchive
          properties:
            Name: gh
            Url: https://github.com/cli/cli/releases/download/v2.92.0/gh_2.92.0_windows_amd64.zip
            Version: 2.92.0
            Binaries: [gh.exe]

        - name: jq
          type: WinTools/DirectBinary
          properties:
            Name: jq.exe
            Url: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe

        - name: fff-mcp
          type: WinTools/DirectBinary
          properties:
            # dmtrKovalenko/fff ships only a library (.dll) plus this MCP server
            # exe on Windows — no standalone CLI. The exe is the only runnable
            # artifact, downloaded straight from the release CDN (no API call).
            Name: fff-mcp.exe
            Url: https://github.com/dmtrKovalenko/fff/releases/download/v0.10.1/fff-mcp-x86_64-pc-windows-msvc.exe

        # fff search libraries — the release asset names are generic
        # (x86_64-pc-windows-msvc.dll), so rename them to fff-prefixed names
        # on disk to disambiguate. Same CDN download, no API call.
        - name: fff-lib
          type: WinTools/DirectBinary
          properties:
            Name: fff.dll
            Url: https://github.com/dmtrKovalenko/fff/releases/download/v0.10.1/x86_64-pc-windows-msvc.dll

        - name: fff-c-lib
          type: WinTools/DirectBinary
          properties:
            Name: fff_c.dll
            Url: https://github.com/dmtrKovalenko/fff/releases/download/v0.10.1/c-lib-x86_64-pc-windows-msvc.dll

        - name: rustup-init
          type: WinTools/DirectBinary
          properties:
            Name: rustup-init.exe
            Url: https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe

        - name: dprint
          type: WinTools/DirectArchive
          properties:
            Name: dprint
            Url: https://github.com/dprint/dprint/releases/download/0.54.0/dprint-x86_64-pc-windows-msvc.zip
            Version: 0.54.0
            Binaries: [dprint.exe]

        - name: beads
          type: WinTools/DirectArchive
          properties:
            Name: beads
            Url: https://github.com/gastownhall/beads/releases/download/v1.0.4/beads_1.0.4_windows_amd64.zip
            Version: 1.0.4
            Binaries: [bd.exe]

        - name: hypa
          type: WinTools/DirectArchive
          properties:
            Name: hypa
            Url: https://github.com/Hypabolic/Hypa/releases/download/v0.1.11/hypa-win-x64.zip
            Version: 0.1.11
            # hypa.exe first: it drives the version check. The DLLs are runtime
            # dependencies that must sit next to the exe (sqlite storage +
            # tree-sitter grammars are loaded from the exe's directory).
            Binaries:
              - hypa.exe
              - e_sqlite3.dll
              - tree-sitter.dll
              - tree-sitter-agda.dll
              - tree-sitter-bash.dll
              - tree-sitter-c-sharp.dll
              - tree-sitter-c.dll
              - tree-sitter-cpp.dll
              - tree-sitter-css.dll
              - tree-sitter-embedded-template.dll
              - tree-sitter-go.dll
              - tree-sitter-haskell.dll
              - tree-sitter-html.dll
              - tree-sitter-java.dll
              - tree-sitter-javascript.dll
              - tree-sitter-jsdoc.dll
              - tree-sitter-json.dll
              - tree-sitter-julia.dll
              - tree-sitter-markdown.dll
              - tree-sitter-ocaml-type.dll
              - tree-sitter-ocaml.dll
              - tree-sitter-php.dll
              - tree-sitter-python.dll
              - tree-sitter-ql.dll
              - tree-sitter-razor.dll
              - tree-sitter-ruby.dll
              - tree-sitter-rust.dll
              - tree-sitter-scala.dll
              - tree-sitter-swift.dll
              - tree-sitter-toml.dll
              - tree-sitter-tsq.dll
              - tree-sitter-tsx.dll
              - tree-sitter-typescript.dll
              - tree-sitter-verilog.dll

        - name: claude-code
          type: WinTools/ScriptInstaller
          properties:
            Name: claude-code
            ScriptUrl: https://claude.ai/install.ps1
            TestPath: '%USERPROFILE%\.local\bin\claude.exe'

  - name: install-dprint-plugins
    type: Microsoft.DSC/PowerShell
    dependsOn:
      - "[resourceId('Microsoft.DSC/PowerShell', 'install-tools')]"
    properties:
      resources:
        - name: dprint-markdown
          type: WinTools/DprintPlugin
          properties:
            Plugin: markdown

